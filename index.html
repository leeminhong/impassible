<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>인파서블 — 인파를 피하는 대안 코스</title>
<meta name="description" content="한국관광공사 관광지 집중률 예측·연관 관광지 데이터로 과밀을 예측하고 한적한 대안 코스를 추천하는 오버투어리즘 분산 웹 서비스">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Gowun+Batang:wght@700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{
  --paper:#f2f4ee; --card:#fff; --ink:#1f2b25; --ink-2:#45524b; --mut:#6f7a6a; --line:#d9dfd3; --line-2:#e8ece4;
  --pine:#2e6a4e; --pine-deep:#1d4633; --pine-soft:#e4efe8;
  --busy:#b23a2c; --busy-bg:#f7e6e2; --mid:#b9761f; --mid-bg:#f8eddb; --calm:#3e8a62; --calm-bg:#e4efe8;
  --data:#3d5573; --data-bg:#e9edf4; --na:#8a938a; --na-bg:#eceee9;
  --cell1:#9dbfae; --cell2:#d9a55a; --cell3:#c9695c;
  --sans:'IBM Plex Sans KR','Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif;
  --serif:'Gowun Batang','Apple SD Gothic Neo',serif;
  --mono:'JetBrains Mono','SF Mono',Consolas,monospace;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--pine);outline-offset:2px}

/* ── 상단 ── */
.top{padding:14px 16px 8px;background:var(--paper);border-bottom:1px solid var(--line);flex-shrink:0}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-family:var(--serif);font-size:20px;color:var(--pine-deep);letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--mut)}
.brand .info{margin-left:auto;background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:11.5px;color:var(--data);font-weight:600}
.selectors{display:flex;gap:8px;margin-top:10px}
.sel{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;min-width:0}
.sel b{display:block;font-size:10.5px;color:var(--mut);margin-bottom:1px;font-weight:600}
.sel select{width:100%;border:none;background:none;font-size:13px;font-family:inherit;color:var(--ink);outline:none}
.sel .val{font-family:var(--mono);font-size:13px}
.datestrip{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.datestrip::-webkit-scrollbar{display:none}
.d{min-width:44px;text-align:center;padding:6px 0 5px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:11px;color:var(--mut);flex-shrink:0}
.d b{display:block;font-size:15px;color:var(--ink);font-family:var(--mono);font-weight:600}
.d.we{background:#fbfbf8}
.d.on,.d.on.we{background:var(--pine);border-color:var(--pine)} .d.on *{color:#fff}
.d .dot{display:block;width:6px;height:6px;border-radius:50%;margin:4px auto 0;background:var(--line)}
.d.on .dot{outline:1.5px solid #fff}

/* ── 레이아웃 ── */
.layout{flex:1;min-height:0;display:flex}
.pane{flex:1;min-width:0;overflow-y:auto;padding:8px 16px 20px}
.pane.right{display:none}
.seg{display:none}
.screen{display:none}.screen.on{display:block}
.sect{font-size:11.5px;color:var(--mut);font-weight:700;margin:14px 2px 8px;letter-spacing:.03em;display:flex;justify-content:space-between;align-items:baseline}
.sect .lgd{font-weight:500;font-size:10.5px}
.legend{display:flex;gap:10px;font-size:10.5px;color:var(--mut);margin:6px 2px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:3px;vertical-align:-1px}

/* ── 상태 ── */
.banner{background:var(--busy-bg);color:var(--busy);font-size:12.5px;padding:10px 12px;border-radius:10px;margin:8px 0;display:none;line-height:1.45}
.banner.on{display:block}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px 16px;margin:8px 0}
.empty h3{font-size:14px;margin-bottom:4px}
.empty p{font-size:12.5px;color:var(--mut)}
.empty .link{color:var(--pine);font-weight:700;cursor:pointer;text-decoration:underline}
.sk{background:linear-gradient(90deg,var(--line-2) 25%,var(--card) 50%,var(--line-2) 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px;height:72px;margin-bottom:10px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}

/* ── 요약 스트립 ── */
.sum{background:var(--pine-deep);color:#fff;border-radius:12px;padding:10px 14px;margin:8px 0 4px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
.sum b{display:block;font-size:14px}
.sum span{font-size:11.5px;opacity:.85}
.sum .arrow{font-size:18px;opacity:.8}

/* ── 신호등 ── */
.sig{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sig::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.sig.busy{background:var(--busy-bg);color:var(--busy)} .sig.mid{background:var(--mid-bg);color:var(--mid)}
.sig.calm{background:var(--calm-bg);color:var(--calm)} .sig.na{background:var(--na-bg);color:var(--na)}
.sig .n{font-family:var(--mono)}

/* ── 예보 카드 ── */
.spot{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 14px;margin-bottom:8px;cursor:pointer}
.spot .r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.spot h3{font-size:14.5px;font-weight:700}
.spot .cat{font-size:11px;color:var(--mut);margin-top:1px}
.spark{display:flex;align-items:flex-end;gap:2px;height:26px;margin-top:8px}
.spark i{flex:1;border-radius:2px 2px 0 0;background:var(--line);min-height:3px}
.spark i.h{background:var(--busy)} .spark i.m{background:var(--cell2)} .spark i.l{background:var(--cell1)}
.spark i.we{opacity:.75}
.spark i.t{outline:2px solid var(--pine-deep);outline-offset:1px}
details.more{margin-top:6px}
details.more summary{font-size:11.5px;color:var(--mut);font-weight:700;cursor:pointer;padding:8px 2px;list-style:none;display:flex;justify-content:space-between}
details.more summary::after{content:'▾'} details.more[open] summary::after{content:'▴'}
.spot.lite{padding:9px 14px}
.spot.lite .spark{display:none}

/* ── 대안 카드 ── */
.alt{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px}
.alt .from{padding:11px 14px;background:var(--busy-bg);display:flex;justify-content:space-between;align-items:center;gap:8px}
.alt .from .nm{font-size:14px;font-weight:600;text-decoration:line-through;text-decoration-color:var(--busy);text-decoration-thickness:2px}
.alt .from .why{font-size:11px;color:var(--mut);display:block;font-weight:400;text-decoration:none}
.alt .to{padding:10px 14px 13px}
.alt .lbl{font-size:11px;color:var(--pine);font-weight:700}
.alt .lbl::before{content:'↳ ';font-size:13px}
.alt h3{font-size:17px;color:var(--pine-deep);margin-top:3px;font-weight:700}
.alt .meta{font-size:12px;color:var(--mut);margin-top:2px}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.bdg{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--pine-soft);color:var(--pine-deep);font-variant-numeric:tabular-nums}
.bdg.eff{background:var(--pine-deep);color:#fff}
.bdg.data{background:var(--data-bg);color:var(--data)}
.bdg.na{background:var(--na-bg);color:var(--na)}
.btn{margin-top:10px;width:100%;padding:10px;border:none;border-radius:10px;background:var(--pine);color:#fff;font-weight:700;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--pine-deep);margin-top:6px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.cal{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.cal .sub{font-size:11px;color:var(--mut);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.grid .h{font-size:10px;color:var(--mut);text-align:center;padding-bottom:2px}
.cell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--mono);position:relative;border:none;padding:0}
.cell.c0{background:transparent;cursor:default}
.cell.c1{background:var(--cell1)}.cell.c2{background:var(--cell2)}.cell.c3{background:var(--cell3)}
.cell.pick{outline:2.5px solid var(--pine-deep);outline-offset:1px}
.cell.best::after{content:'★';position:absolute;top:-4px;right:-2px;font-size:9px;color:var(--pine-deep)}
.altnote{font-size:11px;color:var(--mut);margin-top:8px}

/* ── 코스 ── */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:8px 0 10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-family:var(--mono);font-size:18px;color:var(--pine-deep);font-weight:600}
.stat span{font-size:10.5px;color:var(--mut)}
#map{height:280px;border-radius:16px;border:1px solid var(--line);background:var(--line-2)}
.coursemeta{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:8px;font-family:var(--mono)}
.stops{margin-top:10px}
.stop{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:7px;align-items:center}
.pin{width:26px;height:26px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:var(--mono)}
.p-anchor{background:var(--pine-deep)} .p-cafe{background:#b9761f} .p-walk{background:#5b7fa6}
.stop h4{font-size:13.5px;font-weight:700} .stop p{font-size:11.5px;color:var(--mut);margin-top:1px}
.share{background:var(--pine-deep);color:#fff;border-radius:12px;padding:11px 14px;margin-top:10px}
.share b{display:block;font-size:13px}
.share p{font-size:11.5px;opacity:.85;margin-top:2px;white-space:pre-line}
.share button{margin-top:8px;background:#fff;color:var(--pine-deep);border:none;border-radius:8px;padding:7px 12px;font-weight:700;font-size:12px}
.pinlbl{background:none;border:none;box-shadow:none;color:#fff;font-weight:700;font-size:11px;font-family:var(--mono)}
.leaflet-container{font-family:var(--sans)}

/* ── 탭 ── */
.tabs{display:flex;border-top:1px solid var(--line);background:var(--card);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;text-align:center;padding:9px 0 10px;font-size:10.5px;color:var(--mut);background:none;border:none;font-weight:700}
.tab .ic{font-size:17px;display:block;margin-bottom:1px}
.tab.on{color:var(--pine-deep)}

/* ── 근거 시트 ── */
.sheet-bg{position:fixed;inset:0;background:rgba(31,43,37,.45);display:none;z-index:1000}
.sheet-bg.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;overflow-y:auto;background:var(--paper);border-radius:18px 18px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom,0px));z-index:1001;transform:translateY(100%);transition:transform .25s}
.sheet.on{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
.sheet h2 button{background:none;border:none;font-size:20px;color:var(--mut)}
.sheet h3{font-size:12px;color:var(--mut);font-weight:700;letter-spacing:.03em;margin:16px 0 6px}
.sheet table{width:100%;border-collapse:collapse;font-size:12px}
.sheet td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.sheet td:first-child{color:var(--data);font-weight:600;white-space:nowrap;width:34%}
.sheet p{font-size:12.5px;color:var(--ink-2);margin:4px 0}
.sheet .stats{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
@media (min-width:640px){.sheet{left:50%;right:auto;width:560px;transform:translate(-50%,100%)}.sheet.on{transform:translate(-50%,0)}}

/* ── 데스크톱 2단 ── */
@media (min-width:900px){
  body{max-width:1240px;margin:0 auto}
  .top{padding:16px 24px 10px}
  .brand h1{font-size:22px}
  .selectors{max-width:520px}
  .layout{gap:0}
  .pane.left{flex:0 0 440px;border-right:1px solid var(--line);padding:8px 20px 24px}
  .pane.right{display:block;padding:12px 24px 24px}
  .seg{display:flex;gap:6px;margin:8px 0 4px}
  .seg button{flex:1;padding:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:12.5px;font-weight:700;color:var(--mut)}
  .seg button.on{background:var(--pine-deep);color:#fff;border-color:var(--pine-deep)}
  .tabs{display:none}
  #map{height:380px}
  .stats{grid-template-columns:repeat(4,1fr)}
  #s-map{display:block}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><h1>인파서블</h1><span>인파를 피하는 대안 코스</span>
    <button class="info" onclick="openSheet()" aria-label="데이터 근거 보기">ⓘ 데이터 근거</button></div>
  <div class="selectors">
    <label class="sel"><b>지역</b><select id="regionSel"></select></label>
    <div class="sel"><b>방문 날짜</b><span class="val" id="dateLabel">—</span></div>
  </div>
  <div class="datestrip" id="datestrip"></div>
</header>

<main class="layout">
  <div class="pane left" id="paneLeft">
    <div class="banner" id="banner"></div>
    <nav class="seg" aria-label="왼쪽 화면">
      <button class="on" onclick="go(0)">붐빔 예보</button><button onclick="go(1)">대안 추천</button>
    </nav>

    <section class="screen on" id="s-forecast">
      <div id="summary"></div>
      <div class="sect"><span id="fcTitle">쏠림 앵커</span><span class="lgd">이곳 기준 상대지수 · 테두리 = 선택일</span></div>
      <div id="anchorlist"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
      <div class="legend"><span><i style="background:var(--cell1)"></i>한산 ~49</span><span><i style="background:var(--cell2)"></i>보통 50~74</span><span><i style="background:var(--cell3)"></i>붐빔 75~</span></div>
      <div id="restlist"></div>
    </section>

    <section class="screen" id="s-alt">
      <div class="sect"><span id="altTitle">A 대신 B</span><span class="lgd">연관 방문지 × 집중률 예측</span></div>
      <div id="altlist"><div class="sk"></div><div class="sk"></div></div>
    </section>
  </div>

  <div class="pane right" id="paneRight">
    <section class="screen" id="s-map">
      <div class="stats" id="stats"></div>
      <div class="sect"><span id="courseTitle">코스</span><span class="lgd">점선 = 도보 동선 · 슬롯 = TourAPI 위치기반</span></div>
      <div id="map"></div>
      <div class="coursemeta" id="courseMeta"></div>
      <div class="stops" id="stops"><div class="empty"><h3>아직 코스가 없어요</h3><p>지도의 점은 이 날 쏠림 앵커의 혼잡 단계입니다. 대안 카드에서 "이곳 중심 하루 코스 보기"를 누르면 도보 코스가 그려집니다.</p></div></div>
      <div id="share"></div>
    </section>
  </div>
</main>

<nav class="tabs" aria-label="화면 이동">
  <button class="tab on" onclick="go(0)"><span class="ic">🌤</span>예보</button>
  <button class="tab" onclick="go(1)"><span class="ic">↳</span>대안</button>
  <button class="tab" onclick="go(2)"><span class="ic">🥾</span>코스</button>
  <button class="tab" onclick="openSheet()"><span class="ic">ⓘ</span>근거</button>
</nav>

<div class="sheet-bg" id="sheetBg" onclick="closeSheet()"></div>
<aside class="sheet" id="sheet" aria-label="데이터 근거"></aside>

<script>
/* ═══════════ 설정 ═══════════ */
const PROXY_BASE = "https://impossible-tour-ai.vercel.app"; // Vercel 서버리스 프록시 (키 은닉·캐싱)
const ANCHOR_RANK_MAX = 50;   // 쏠림 앵커: 중심 관광지 순위 상한
const ANCHOR_MIN = 3;         // 앵커가 이보다 적으면 Tier1 상위 3곳으로 보충
const BUSY = 75, CALM = 50;   // 혼잡 3단계 경계
const ALT_RANK_MAX = 20;      // 대안 후보: 연관 순위 상한 (없으면 완화)
const ALT_MIN_DROP = 25;      // 대안 채택 조건: 앵커 대비 집중률 최소 차이(p)
const XREGION_MAX = 8;       // 대안 후보의 타 시군구 집중률을 추가 로드하는 최대 지역 수

const REGIONS = [
  ["11","11110","서울 · 종로구"],["11","11140","서울 · 중구"],["11","11170","서울 · 용산구"],
  ["11","11200","서울 · 성동구"],["11","11440","서울 · 마포구"],["11","11650","서울 · 서초구"],
  ["11","11680","서울 · 강남구"],["11","11710","서울 · 송파구"],["11","11740","서울 · 강동구"],
  ["47","47130","경북 · 경주시"],["51","51150","강원 · 강릉시"],["51","51210","강원 · 속초시"],["50","50110","제주 · 제주시"],
];
const ANCHOR_CATS = new Set(["문화관광","역사관광","자연관광","레저스포츠","체험관광","쇼핑"]);
const ALT_CATS    = new Set(["문화관광","역사관광","자연관광","레저스포츠","체험관광"]);
const ALIASES = { "코엑스":"한국종합무역센터(코엑스)", "롯데월드/잠실점":"롯데월드 어드벤처", "응봉산팔각정":"응봉산(서울)" };

/* ═══════════ 유틸 ═══════════ */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => (s||"").normalize("NFC").replace(/\[[^\]]*\]/g,"").replace(/\([^)]*\)/g,"").replace(/[\s·ㆍ\-–—_/\\.,'"&]/g,"").toLowerCase();
const normKP = s => (s||"").replace(/[\s·ㆍ\-–—_/\\.,'"&()\[\]]/g,"").toLowerCase();
const DAYS = ['일','월','화','수','목','금','토'];
const toDate = y => new Date(+y.slice(0,4), +y.slice(4,6)-1, +y.slice(6,8));
const fmtD = y => { const d=toDate(y); return `${d.getMonth()+1}/${d.getDate()}(${DAYS[d.getDay()]})`; };
const fmtDL = y => { const d=toDate(y); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DAYS[d.getDay()]})`; };
const isWE = y => { const g=toDate(y).getDay(); return g===0||g===6; };
const band  = v => v>=BUSY?'busy':v>=CALM?'mid':'calm';
const bandK = v => v>=BUSY?'붐빔':v>=CALM?'보통':'한산';
const R = v => Math.round(v);
const sigHtml = (v, prefix=true) => v==null ? `<span class="sig na">데이터 없음</span>`
  : `<span class="sig ${band(v)}">${prefix&&v>=BUSY?'이곳 기준 ':''}${bandK(v)} <span class="n">${R(v)}</span></span>`;
function haversine(a,b,c,d){const Rr=6371e3,r=x=>x*Math.PI/180,dy=r(c-a),dx=r(d-b);
  const h=Math.sin(dy/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(dx/2)**2; return 2*Rr*Math.asin(Math.sqrt(h));}
function banner(msg){ const b=$('banner'); if(!msg){b.classList.remove('on');b.textContent='';return;} b.textContent=msg; b.classList.add('on'); }

async function api(svc, params){
  const q = new URLSearchParams({svc, ...params});
  const r = await fetch(`${PROXY_BASE}/api/kto?${q}`);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  if (j.resultCode && j.resultCode!=="0000") throw new Error(j.resultMsg||j.resultCode);
  return j;
}
const items = j => { let it=j?.response?.body?.items?.item||[]; return Array.isArray(it)?it:(it?[it]:[]); };
async function apiAll(svc, params, rows=1000, maxPages=6){
  let out=[], page=1, total=Infinity;
  while(out.length<total && page<=maxPages){
    const j = await api(svc, {...params, numOfRows:rows, pageNo:page});
    const body = j?.response?.body; if(!body) break;
    total = body.totalCount ?? 0;
    const it = items(j); out = out.concat(it);
    if(!it.length) break; page++;
  }
  return out;
}
// ②③ 기준연월: 이번 달부터 역순으로 최대 4개월 탐색
const ymCache = new Map();
async function probeBaseYm(areaCd, signguCd){
  const k=areaCd+signguCd; if(ymCache.has(k)) return ymCache.get(k);
  const now=new Date();
  for(let i=0;i<4;i++){
    const d=new Date(now.getFullYear(), now.getMonth()-i, 1);
    const ym=`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`;
    try{ const j=await api('hub',{areaCd,signguCd,baseYm:ym,numOfRows:1,pageNo:1});
         if((j?.response?.body?.totalCount??0)>0){ ymCache.set(k,ym); return ym; } }catch(e){}
  }
  return "202506";
}

let S = null;
let COURSE = null;

/* ═══════════ 데이터 로드 & 매칭 ═══════════ */
async function loadRegion(areaCd, signguCd, name){
  S = null; COURSE = null;
  $('anchorlist').innerHTML='<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  $('restlist').innerHTML=''; $('summary').innerHTML='';
  $('altlist').innerHTML='<div class="sk"></div><div class="sk"></div>';
  $('stats').innerHTML=''; banner('');
  try{
    const baseYm = await probeBaseYm(areaCd, signguCd);
    const [i1, i2, i3] = await Promise.all([
      apiAll('cnctr', {areaCd, signguCd}),
      apiAll('hub',   {areaCd, signguCd, baseYm}, 100, 2),
      apiAll('rlte',  {areaCd, signguCd, baseYm}),
    ]);
    if(!i1.length) throw new Error('이 지역은 집중률 예측 데이터가 없습니다.');

    // ① 관광지 → 날짜 → 집중률 (시군구별 풀)
    const pools = new Map();               // signguCd → {spots, poolN, poolKP}
    pools.set(signguCd, makePool(i1));
    const {spots, poolN} = pools.get(signguCd);
    const names1=[...spots.keys()];
    const match1 = nm => matchIn(pools.get(signguCd), nm);
    // ② 중심 관광지 → Tier1
    const hubByNorm=new Map(), tier1=[];
    i2.forEach(h=>{ hubByNorm.set(norm(h.hubTatsNm),h); if(!ANCHOR_CATS.has(h.hubCtgryMclsNm)) return;
      const n1=match1(h.hubTatsNm); if(n1) tier1.push({hub:h.hubTatsNm,n1,code:h.hubTatsCd,cat:h.hubCtgryMclsNm,lat:+h.mapY,lng:+h.mapX,rank:+h.hubRank}); });
    tier1.sort((a,b)=>a.rank-b.rank);
    let anchors = tier1.filter(t=>t.rank<=ANCHOR_RANK_MAX);
    if(anchors.length<ANCHOR_MIN) anchors = tier1.slice(0,ANCHOR_MIN);
    // ③ 연관
    const rlteByCode=new Map();
    i3.forEach(r=>{ if(!rlteByCode.has(r.tAtsCd)) rlteByCode.set(r.tAtsCd,[]); rlteByCode.get(r.tAtsCd).push(r); });
    // 대안 후보가 속한 타 시군구의 집중률 추가 로드 (광역 분산 판정용)
    const xcount=new Map();
    anchors.forEach(a=>(rlteByCode.get(a.code)||[]).forEach(r=>{
      if(r.rlteCtgryLclsNm==='관광지' && ALT_CATS.has(r.rlteCtgryMclsNm) && r.rlteSignguCd && r.rlteSignguCd!==signguCd)
        xcount.set(r.rlteSignguCd, {n:(xcount.get(r.rlteSignguCd)?.n||0)+1/(+r.rlteRank||50), areaCd:r.rlteRegnCd}); })); // 연관 상위일수록 가중
    const xregs=[...xcount.entries()].sort((a,b)=>b[1].n-a[1].n).slice(0,XREGION_MAX);
    const xres=await Promise.all(xregs.map(([sg,{areaCd:ac}])=>apiAll('cnctr',{areaCd:ac,signguCd:sg},1000,3).catch(()=>[])));
    xregs.forEach(([sg],i)=>{ if(xres[i].length) pools.set(sg, makePool(xres[i])); });

    const dates=[...new Set(i1.map(it=>it.baseYmd))].sort();
    const regionShort = name.split('·').pop().trim();
    S={ region:{areaCd,signguCd,name,short:regionShort}, baseYm, spots, names1, dates, selYmd:dates[0], pools,
        tier1, anchors, rlteByCode, hubByNorm, match1, counts:{i1:i1.length,i2:i2.length,i3:i3.length,x:pools.size-1} };
    S.stats = computeStats();
    renderDateStrip(); renderForecast(); renderAlts(); renderStats(); drawAnchorMap();
  }catch(e){
    banner('데이터를 불러오지 못했습니다: '+e.message+' — 잠시 후 다시 시도하거나 다른 지역을 선택해 주세요.');
    $('anchorlist').innerHTML=''; $('altlist').innerHTML='';
  }
}

/* ═══════════ 추천 로직 ═══════════ */
function makePool(rows){
  const spots=new Map();
  rows.forEach(it=>{ if(!it.tAtsNm) return; if(!spots.has(it.tAtsNm)) spots.set(it.tAtsNm,{}); spots.get(it.tAtsNm)[it.baseYmd]=parseFloat(it.cnctrRate)||0; });
  const names=[...spots.keys()];
  return { spots, poolN:new Map(names.map(n=>[norm(n),n])), poolKP:new Map(names.map(n=>[normKP(n),n])) };
}
function matchIn(pool, nm){
  if(!pool) return null;
  const tn=norm(nm), tk=normKP(nm);
  if(pool.poolN.has(tn)) return pool.poolN.get(tn);
  if(tk.length>=4){ const c=[...pool.poolKP.entries()].filter(([k])=>(tk.includes(k)||k.includes(tk))&&Math.min(k.length,tk.length)>=4).map(([,v])=>v);
    if(new Set(c).size===1) return c[0]; }
  const al=ALIASES[nm]; if(al&&pool.poolN.has(norm(al))) return pool.poolN.get(norm(al));
  return null;
}
const rateOf = (n1, ymd, sg) => { const p=sg? S.pools.get(sg) : null; const d=(p? p.spots : S.spots).get(n1); return d? (d[ymd] ?? null) : null; };
const sortAlts = (x,y)=> ((x.rk<=ALT_RANK_MAX)!==(y.rk<=ALT_RANK_MAX)) ? (x.rk<=ALT_RANK_MAX?-1:1) : (x.same!==y.same ? (x.same?-1:1) : x.rk-y.rk);
function altsFor(anchor, ymd){
  const aRate = rateOf(anchor.n1, ymd);
  const raw = (S.rlteByCode.get(anchor.code)||[])
    .filter(r=> r.rlteCtgryLclsNm==='관광지' && ALT_CATS.has(r.rlteCtgryMclsNm) && norm(r.rlteTatsNm)!==norm(anchor.hub))
    .map(r=>{ const sg=r.rlteSignguCd, pool=S.pools.get(sg)||(sg===S.region.signguCd?S.pools.get(S.region.signguCd):null);
      const n1=matchIn(pool, r.rlteTatsNm);
      return {...r, n1, sg, rate: n1? rateOf(n1,ymd,sg) : null, rk:+r.rlteRank, same: r.rlteCtgryMclsNm===anchor.cat}; });
  const ok = raw.filter(x=> x.rate!=null && aRate!=null && (aRate-x.rate)>=ALT_MIN_DROP);
  const calm = ok.filter(x=>x.rate<CALM).sort(sortAlts);
  const mid  = ok.filter(x=>x.rate>=CALM && x.rate<BUSY).sort(sortAlts);
  const best = calm[0] ? {...calm[0], tier:'calm'} : (mid[0] ? {...mid[0], tier:'mid'} : null);
  const noData = raw.filter(x=>x.rate==null).sort((x,y)=>x.rk-y.rk).slice(0,2);
  return { best, noData, aRate };
}
function bestDay(anchor){
  let best=null; S.dates.forEach(y=>{ const v=rateOf(anchor.n1,y); if(v!=null && (best==null||v<best.v)) best={y,v}; }); return best;
}
function summaryFor(ymd){
  const rows = S.anchors.map(a=>({a, rate:rateOf(a.n1,ymd)})).filter(r=>r.rate!=null);
  const busy = rows.filter(r=>r.rate>=BUSY);
  const withAlt = busy.filter(r=>altsFor(r.a,ymd).best);
  let calmest=null; S.dates.forEach(y=>{ const vs=S.anchors.map(a=>rateOf(a.n1,y)).filter(v=>v!=null); if(!vs.length) return;
    const m=vs.reduce((s,v)=>s+v,0)/vs.length; if(calmest==null||m<calmest.m) calmest={y,m}; });
  return { n:rows.length, busy:busy.length, withAlt:withAlt.length, calmest };
}
function computeStats(){
  let anchorDays=0, busyDays=0, deltas=[], dateDeltas=[], pairs=new Map();
  S.anchors.forEach(a=>{
    const bd=bestDay(a);
    S.dates.forEach(y=>{ const v=rateOf(a.n1,y); if(v==null) return; anchorDays++;
      if(v>=BUSY){ busyDays++; const {best}=altsFor(a,y); if(best){ deltas.push(v-best.rate); pairs.set(a.code+'>'+best.rlteTatsCd, best.rlteSignguNm!==S.region.short); }
        if(bd) dateDeltas.push(v-bd.v); } });
  });
  const avg = xs => xs.length? xs.reduce((s,v)=>s+v,0)/xs.length : null;
  const cross=[...pairs.values()].filter(Boolean).length;
  return { anchorDays, busyDays, busyShare: anchorDays? busyDays/anchorDays : 0, altShare: busyDays? deltas.length/busyDays : 0,
           avgDelta: avg(deltas), avgDateDelta: avg(dateDeltas), pairs:pairs.size, cross, crossShare: pairs.size? cross/pairs.size : 0 };
}

    return `<div class="alt" data-code="${esc(a.code)}">${from}<div class="to">

      <div class="badges">${bd? `<span class="bdg eff">선택일 대비 −${R(a.rate-bd.v)}p</span>`:''}<span class="bdg data">집중률 예측 30일</span></div>

function toggleCal(btn, code){
  const card=btn.closest('.alt'), wrap=card.querySelector('.calwrap');
  if(wrap.innerHTML){ wrap.innerHTML=''; return; }
  const a=S.anchors.find(x=>x.code===code); if(!a) return;
  const d=S.spots.get(a.n1)||{}, bd=bestDay(a);
  let g=DAYS.map(x=>`<div class="h">${x}</div>`).join('') + '<div class="cell c0"></div>'.repeat(toDate(S.dates[0]).getDay());
  S.dates.forEach(y=>{ const v=d[y]; if(v==null){ g+='<div class="cell c0"></div>'; return; }
    g+=`<button class="cell ${v>=BUSY?'c3':v>=CALM?'c2':'c1'} ${y===S.selYmd?'pick':''} ${bd&&bd.y===y?'best':''}" title="${fmtD(y)} ${R(v)}" onclick="pickDate('${y}')">${+y.slice(6,8)}</button>`; });
  wrap.innerHTML=`<div class="cal"><div class="sub">${esc(a.hub)} · 향후 30일 · 이곳 기준 상대지수 · ★ 가장 한산한 날 · 탭하면 그 날짜로</div><div class="grid">${g}</div></div>`;
}

/* ═══════════ 코스 ═══════════ */
async function findCoords(name, regnCd, sg){
  const h=S.hubByNorm.get(norm(name)); if(h) return {lat:+h.mapY,lng:+h.mapX,src:'중심 관광지'};
  const base=name.replace(/\([^)]*\)/g,'').replace(/\/.*$/,'').trim();
  for(const kw of [...new Set([base, name.replace(/\s+/g,''), base.replace(/\s+/g,'')])]){
    try{ const p={keyword:kw,numOfRows:5,lDongRegnCd:regnCd||S.region.areaCd,arrange:'A',pageNo:1};
      if(sg && sg.length===5 && regnCd) p.lDongSignguCd=sg.slice(2);
      const j=await api('kw',p);
      const hit=items(j).find(x=>x.mapx&&x.mapy); if(hit) return {lat:+hit.mapy,lng:+hit.mapx,src:'TourAPI 검색',img:hit.firstimage}; }catch(e){}
  }
  return null;
}
async function buildCourse(name, regnCd, fromHub, fromRate, toRate, sg){
  go(2);
  $('courseTitle').textContent=`${name} 한갓 코스`;
  $('stops').innerHTML='<div class="sk"></div><div class="sk"></div>'; $('courseMeta').innerHTML=''; $('share').innerHTML='';
  const c=await findCoords(name, regnCd, sg);
  if(!c){ $('stops').innerHTML='<div class="empty"><h3>좌표를 찾지 못했어요</h3><p>이 장소는 중심 관광지·TourAPI 어디에도 좌표가 없어 코스를 그릴 수 없습니다.</p></div>'; return; }
  let food=[], cult=[];
  try{ [food,cult]=await Promise.all([
      api('loc',{mapX:c.lng,mapY:c.lat,radius:1000,contentTypeId:39,arrange:'E',numOfRows:20,pageNo:1}).then(items),
      api('loc',{mapX:c.lng,mapY:c.lat,radius:1200,contentTypeId:12,arrange:'E',numOfRows:10,pageNo:1}).then(items)]); }catch(e){}
  const cafe=food.find(x=>(x.lclsSystm2==='FD02'||/카페|커피|찻집|베이커리/.test(x.title))&&x.firstimage)||food.find(x=>/카페|커피|찻집/.test(x.title))||food[0];
  const walk=cult.find(x=>norm(x.title)!==norm(name));
  const stops=[{t:name,sub:`앵커 · 한적 대안지${toRate!=null?` · 이 날 이곳 기준 ${bandK(toRate)} ${R(toRate)}`:''}`,cls:'p-anchor',lat:c.lat,lng:c.lng}];
  if(cafe) stops.push({t:cafe.title,sub:'슬롯 · 카페/음식',cls:'p-cafe',lat:+cafe.mapy,lng:+cafe.mapx});
  if(walk) stops.push({t:walk.title,sub:'슬롯 · 산책/볼거리',cls:'p-walk',lat:+walk.mapy,lng:+walk.mapx});
  let dist=0; for(let i=1;i<stops.length;i++) dist+=haversine(stops[i-1].lat,stops[i-1].lng,stops[i].lat,stops[i].lng);
  COURSE={name,stops,dist,fromHub,fromRate,toRate};
  $('courseMeta').innerHTML=`<span>스톱 ${stops.length}곳</span><span>도보 약 ${(dist/1000).toFixed(1)}km · ${Math.round(dist/67)}분</span><span>좌표: ${c.src}</span>`;
  $('stops').innerHTML=stops.map((s,i)=>`<div class="stop"><div class="pin ${s.cls}">${i+1}</div><div><h4>${esc(s.t)}</h4><p>${esc(s.sub)} · ${i>0?'도보 '+Math.round(haversine(stops[i-1].lat,stops[i-1].lng,s.lat,s.lng)/67)+'분':'출발점'}</p></div></div>`).join('');
  const txt=`${fmtD(S.selYmd)} ${S.region.short} · ${fromHub}(이곳 기준 붐빔 ${R(fromRate)}) 대신 ${name}${toRate!=null?`(한산 ${R(toRate)}, −${R(fromRate-toRate)}p)`:''}\n코스: ${stops.map(s=>s.t).join(' → ')} · 도보 ${(dist/1000).toFixed(1)}km\n${location.href.split('#')[0]}`;
  $('share').innerHTML=`<div class="share"><b>발견 카드</b><p>${esc(txt)}</p><button onclick="copyShare(this)">텍스트 복사</button></div>`;
  $('share').dataset.txt=txt;
  renderStats(); drawMap(stops);
}
async function copyShare(btn){ try{ await navigator.clipboard.writeText($('share').dataset.txt); btn.textContent='복사됨'; setTimeout(()=>btn.textContent='텍스트 복사',1500);}catch(e){ btn.textContent='복사 실패 — 길게 눌러 선택'; } }
let MAP=null, LAYER=null;
function ensureMap(){
  if(MAP) return;
  MAP=L.map('map',{zoomControl:false});
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors',maxZoom:19}).addTo(MAP);
}
// 코스가 없을 때: 앵커를 이 날의 혼잡 단계 색으로 지도에 표시
function drawAnchorMap(){
  if(COURSE || !S) return;
  ensureMap(); if(LAYER) LAYER.remove(); LAYER=L.layerGroup().addTo(MAP);
  const cols={busy:'#b23a2c',mid:'#b9761f',calm:'#3e8a62'};
  const pts=S.anchors.filter(a=>a.lat&&a.lng);
  if(!pts.length) return;
  pts.forEach(a=>{ const v=rateOf(a.n1,S.selYmd); const col=v==null?'#8a938a':cols[band(v)];
    L.circleMarker([a.lat,a.lng],{radius:10,color:'#fff',weight:2,fillColor:col,fillOpacity:1}).addTo(LAYER)
      .bindTooltip(`${a.hub}${v!=null?' · '+bandK(v)+' '+R(v):''}`,{direction:'top',offset:[0,-8]}); });
  MAP.fitBounds(pts.map(a=>[a.lat,a.lng]),{padding:[40,40],maxZoom:14}); setTimeout(()=>MAP.invalidateSize(),100);
}
function drawMap(stops){
  ensureMap();
  if(LAYER) LAYER.remove(); LAYER=L.layerGroup().addTo(MAP);
  const cols={'p-anchor':'#1d4633','p-cafe':'#b9761f','p-walk':'#5b7fa6'};
  stops.forEach((s,i)=>L.circleMarker([s.lat,s.lng],{radius:11,color:'#fff',weight:2,fillColor:cols[s.cls],fillOpacity:1}).addTo(LAYER).bindTooltip(String(i+1),{permanent:true,direction:'center',className:'pinlbl'}));
  L.polyline(stops.map(s=>[s.lat,s.lng]),{color:'#2e6a4e',weight:3,dashArray:'2 8',lineCap:'round'}).addTo(LAYER);
  // 원래 붐비던 앵커 → 대안 이동선 (분산 시각화)
  if(COURSE?.fromHub){ const h=S.tier1.find(t=>t.hub===COURSE.fromHub); if(h&&h.lat&&h.lng){
    L.circleMarker([h.lat,h.lng],{radius:9,color:'#fff',weight:2,fillColor:'#b23a2c',fillOpacity:1}).addTo(LAYER).bindTooltip('A',{permanent:true,direction:'center',className:'pinlbl'});
    L.polyline([[h.lat,h.lng],[stops[0].lat,stops[0].lng]],{color:'#b23a2c',weight:2,dashArray:'1 7'}).addTo(LAYER);
    MAP.fitBounds([...stops.map(s=>[s.lat,s.lng]),[h.lat,h.lng]],{padding:[36,36]}); setTimeout(()=>MAP.invalidateSize(),100); return; } }
  MAP.fitBounds(stops.map(s=>[s.lat,s.lng]),{padding:[36,36]}); setTimeout(()=>MAP.invalidateSize(),100);
}

/* ═══════════ 근거 시트 ═══════════ */
function openSheet(){
  const st=S?.stats, sm=S?summaryFor(S.selYmd):null;
  const pct=v=>Math.round(v*100)+'%';
  $('sheet').innerHTML=`<h2>데이터 근거 <button onclick="closeSheet()" aria-label="닫기">×</button></h2>
    <p>${S? `${esc(S.region.name)} · 집중률 ${S.counts.i1.toLocaleString()}행(관광지 ${S.names1.length}곳 × 30일) · 중심 관광지 ${S.counts.i2}곳 · 연관 ${S.counts.i3.toLocaleString()}행 · 기준연월 ${S.baseYm}${S.counts.x? ` · 대안 판정용 타 시군구 집중률 ${S.counts.x}곳 추가 로드`:''}` : '지역 데이터를 불러오는 중입니다.'}</p>
    <h3>활용 OpenAPI 4종 (한국관광공사)</h3>
    <table>
      <tr><td>집중률 방문자 추이 예측</td><td>관광지별 향후 30일 집중률. KT 이동통신 기반. <b>장소별 상대지수</b>(그 장소의 최번기 = 100)라 장소 간 비교는 하지 않습니다.</td></tr>
      <tr><td>기초지자체 중심 관광지</td><td>시군구별 중심성 상위 100곳, 좌표·순위·카테고리. 쏠림 앵커 정의(순위 ${ANCHOR_RANK_MAX}위 이내)와 지도 좌표에 사용.</td></tr>
      <tr><td>관광지별 연관 관광지</td><td>티맵 내비 동선 기반('24.5~'25.4) 함께 방문한 관광지 순위. 실시간이 아닌 구조 데이터로, "같은 취향의 대안" 후보에 사용.</td></tr>
      <tr><td>국문 관광정보 (TourAPI)</td><td>대안지 반경 1~1.2km 카페·볼거리 위치기반 조회, 좌표 보강. 코스 슬롯 구성에 사용.</td></tr>
    </table>
    <h3>판정 규칙</h3>
    <table>
      <tr><td>혼잡 3단계</td><td>한산 &lt;${CALM} · 보통 ${CALM}~${BUSY-1} · 붐빔 ≥${BUSY} (이곳 기준 상대지수)</td></tr>
      <tr><td>쏠림 앵커</td><td>중심 관광지(관광 카테고리) ∩ 집중률 관광지, 이름 정규화·별칭으로 연결된 곳 중 순위 ${ANCHOR_RANK_MAX}위 이내. 연결 안 되는 관광지는 "예보 전용".</td></tr>
      <tr><td>장소 대안</td><td>앵커의 연관 관광지 중 관광 카테고리 · 앵커보다 ${ALT_MIN_DROP}p 이상 낮음 · 이 날 한산(&lt;${CALM}) 우선, 없으면 보통(&lt;${BUSY})을 "덜 붐비는 곳"으로 표기. 연관 ${ALT_RANK_MAX}위 이내·같은 중분류 우선. 타 시군구 후보는 그 시군구 집중률을 따로 불러 판정. 혼잡 데이터 없는 곳은 추천하지 않습니다.</td></tr>
      <tr><td>날짜 대안</td><td>같은 장소의 30일 중 집중률이 가장 낮은 날.</td></tr>
    </table>
    ${st? `<h3>${esc(S.region.short)} 30일 분산 효과 (데이터로 계산)</h3>
    <div class="stats">
      <div class="stat"><b>${pct(st.busyShare)}</b><span>앵커-일 중 붐빔 (${st.busyDays}/${st.anchorDays})</span></div>
      <div class="stat"><b>${st.avgDelta!=null?'−'+R(st.avgDelta)+'p':'—'}</b><span>장소 대안 채택 시 평균 변화 · 붐빔일의 ${pct(st.altShare)}에 대안 존재</span></div>
      <div class="stat"><b>${st.avgDateDelta!=null?'−'+R(st.avgDateDelta)+'p':'—'}</b><span>가장 한산한 날로 옮길 때 평균 변화</span></div>
      <div class="stat"><b>${st.pairs? pct(st.crossShare):'—'}</b><span>대안 중 타 시군구 비율 (${st.cross}/${st.pairs}) · 광역 분산</span></div>
    </div>`:''}
    <h3>한계</h3>
    <p>집중률은 예측치이며 절대 방문자 수가 아닙니다. 연관 관광지는 차량 이동 기준 집계라 도보 취향과 다를 수 있습니다. 프록시가 응답을 6~24시간 캐시하므로 표시 시점과 원본 갱신에 시차가 있을 수 있습니다.</p>`;
  $('sheetBg').classList.add('on'); $('sheet').classList.add('on');
}
function closeSheet(){ $('sheetBg').classList.remove('on'); $('sheet').classList.remove('on'); }

/* ═══════════ 네비게이션 ═══════════ */
const isDesk = () => window.matchMedia('(min-width:900px)').matches;
function go(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('on', j===i));
  document.querySelectorAll('.seg button').forEach((b,j)=>b.classList.toggle('on', j===Math.min(i,1)));
  if(isDesk()){
    $('s-forecast').classList.toggle('on', i!==1); $('s-alt').classList.toggle('on', i===1); $('s-map').classList.add('on');
    if(i===2) $('paneRight').scrollIntoView({behavior:'smooth'});
  }else{
    $('s-forecast').classList.toggle('on', i===0); $('s-alt').classList.toggle('on', i===1); $('s-map').classList.toggle('on', i===2);
    $('paneLeft').style.display = i===2?'none':''; $('paneRight').style.display = i===2?'block':'';
  }
  if(MAP) setTimeout(()=>MAP.invalidateSize(),120);
}
window.matchMedia('(min-width:900px)').addEventListener('change', ()=>{ $('paneLeft').style.display=''; $('paneRight').style.display=''; go(document.querySelector('.tab.on') ? [...document.querySelectorAll('.tab')].findIndex(t=>t.classList.contains('on')) : 0); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });

$('regionSel').onchange = e=>{ const [a,s,n]=REGIONS[+e.target.value]; loadRegion(a,s,n); };
go(0);
